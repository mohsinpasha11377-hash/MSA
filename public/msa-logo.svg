  <text x="160" y="278" text-anchor="middle" fill="#F3EDE3" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4.5">INTERIOR AND</text>
  <text x="160" y="308" text-anchor="middle" fill="#F3EDE3" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4.5">  EXTERIOR  </text>
</svg>
